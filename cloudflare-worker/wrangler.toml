name = "techtis-edge"
main = "worker.js"
compatibility_date = "2024-04-01"

# 100% Free Tier Cloudflare Workers configuration
# - 100,000 Edge requests/day at $0 cost
# - Zero servers, zero maintenance, global Anycast edge

# ==============================================================
# 1. Cloudflare Workers AI Binding (10,000 Free Neurons/Day)
# ==============================================================
# Gives your TECHTIS platform access to Meta Llama 3.1 8B and M2M100
# translation without needing ANY external API keys or paid accounts!
[ai]
binding = "AI"

# ==============================================================
# 2. Cloudflare D1 Database Binding (5,000,000 Free Reads/Day)
# ==============================================================
# Serverless SQLite for telemetry, aggregate counters, and user feedback.
# To create your free D1 database, run in your terminal:
#   npx wrangler d1 create techtis-pdf-db
# Then replace database_id below with the id printed in your terminal:
[[d1_databases]]
binding = "DB"
database_name = "techtis-pdf-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# ==============================================================
# 3. Environment Secrets (Optional)
# ==============================================================
# Configure secrets securely via CLI:
#   npx wrangler secret put OCR_SPACE_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
[vars]
OCR_SPACE_API_KEY = "K87899142388957"
